<div class="admin-container">
  
  <button class="btn-toggle-sidebar" [class.fechada]="!sidebarAberta" (click)="toggleSidebar()">
    {{ sidebarAberta ? '◀' : '▶' }}
  </button>

  <div class="sidebar" [class.fechada]="!sidebarAberta">
    
    <div class="tabs-header">
      <button [class.ativa]="abaAtiva === 'rotas'" (click)="abaAtiva = 'rotas'">🛣️ Trajetos</button>
      <button [class.ativa]="abaAtiva === 'paradas'" (click)="abaAtiva = 'paradas'">🚏 Pontos</button>
    </div>

    <div class="sidebar-content">
      
      <div *ngIf="abaAtiva === 'rotas'">
        <button class="btn-principal" (click)="criarNovaRota()">+ Nova Rota</button>
        
        <div class="lista-items">
          <div *ngFor="let r of rotas" class="card-item" [class.selecionado]="r.id === rotaSelecionada?.id" (click)="rotaSelecionada = r">
            
            <div class="card-header-rota">
              <span class="cor-dot" [style.background-color]="r.cor"></span>
              <input [(ngModel)]="r.nome" (blur)="atualizarNomeRota(r)" class="input-transparente" (click)="$event.stopPropagation()">
              <button class="btn-mini-del" (click)="excluirRota(r.id, $event)">🗑️</button>
            </div>

            <div *ngIf="r.id === rotaSelecionada?.id" class="controles-extras" (click)="$event.stopPropagation()">
              <label class="ciclo-toggle">
                <input type="checkbox" [checked]="r.isCiclica" (change)="alternarCiclo(r)">
                🔄 Rota Cíclica (Volta ao início)
              </label>
            </div>

          </div>
        </div>
      </div>

      <div *ngIf="abaAtiva === 'paradas'">
        <p class="instrucao">Clique no mapa para criar um novo ponto de ônibus global.</p>
        <div class="lista-items">
          <div *ngFor="let p of paradas" class="card-item" (click)="abrirEditorParada(p)">
            <span>🚏 {{ p.nome }}</span>
            <small>{{ p.horarios.length }} horários</small>
          </div>
        </div>
      </div>

    </div>

    <div class="toolbar">
      <button [class.ativo]="modoEdicao === 'desenhar'" (click)="modoEdicao = 'desenhar'">✍️ Desenhar</button>
      <button [class.ativo]="modoEdicao === 'borracha'" (click)="modoEdicao = 'borracha'" class="btn-borracha">🧹 Apagar</button>
    </div>
  </div>

  <div class="map-wrapper">
    <div id="mapAdmin"></div>
  </div>

  <div class="modal-backdrop" *ngIf="paradaEmEdicao">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Gerenciar Ponto de Ônibus</h3>
        <button (click)="paradaEmEdicao = null">✕</button>
      </div>

      <div class="modal-body">
        <label>Nome do Ponto:</label>
        <input type="text" [(ngModel)]="paradaEmEdicao.nome" class="form-control">

        <hr>
        <h4>Vincular Horário a uma Rota</h4>
        <div class="add-horario-complexo">
          <input type="time" [(ngModel)]="novoHorarioHora">
          <select [(ngModel)]="novoHorarioRotaId">
            <option value="">Selecione a Rota</option>
            <option *ngFor="let r of rotas" [value]="r.id">{{ r.nome }}</option>
          </select>
          <button (click)="adicionarHorarioAParada()">+</button>
        </div>

        <div class="tabela-horarios">
          <div *ngFor="let h of paradaEmEdicao.horarios; let i = index" class="linha-horario">
            <strong>{{ h.hora }}</strong>
            <span class="badge-rota" [style.background]="'#eee'">{{ getNomeRota(h.rotaId) }}</span>
            <button (click)="removerHorarioDaParada(i)">✕</button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-salvar" (click)="salvarParada()">Salvar Tudo</button>
      </div>
    </div>
  </div>

</div>
