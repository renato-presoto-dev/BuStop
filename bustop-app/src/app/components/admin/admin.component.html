<div class="admin-container">
  
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Gerenciador de Rotas</h2>
      <button class="btn-criar" (click)="criarNovaRota()">+ Nova Rota</button>
    </div>

    <div class="lista-rotas">
      <div *ngIf="rotasVisuais.length === 0" class="empty-state">
        Nenhuma rota criada.<br>Clique em "+ Nova Rota".
      </div>

      <div 
        *ngFor="let rota of rotasVisuais" 
        class="rota-card" 
        [class.selecionada]="rota.id === rotaSelecionada?.id"
        (click)="selecionarRota(rota)"
      >
        <div class="rota-info">
          <span class="cor-dot" [style.background-color]="rota.cor"></span>
          <input 
            [(ngModel)]="rota.nome" 
            (blur)="atualizarNomeRota(rota)"
            (click)="$event.stopPropagation()"
            class="input-nome"
          >
        </div>
        <div class="btnexcluir">
          <button class="btn-excluir" (click)="excluirRota(rota, $event)" title="Excluir Rota">
              🗑️
          </button>
        </div>

        <div *ngIf="rota.id === rotaSelecionada?.id" class="rota-controles">
          <label class="ciclo-toggle">
            <input type="checkbox" [checked]="rota.isCiclica" (change)="alternarCiclo(rota)">
            Rota Cíclica (Volta ao início)
          </label>

            flex-direction: column;
<div class="ferramentas-desenho">
            <button 
              [class.ativo]="modoEdicao === 'caminho'" 
              (click)="modoEdicao = 'caminho'; $event.stopPropagation()">
              〰️ Trajeto
            </button>
            <button 
              [class.ativo]="modoEdicao === 'parada'" 
              (click)="modoEdicao = 'parada'; $event.stopPropagation()">
              🚏 Parada
            </button>
            <button 
              [class.ativo]="modoEdicao === 'borracha'" 
              class="btn-borracha"
              (click)="modoEdicao = 'borracha'; $event.stopPropagation()">
              🧹 Apagar
            </button>
          </div>
          
          <small class="dica-ferramenta" *ngIf="modoEdicao !== 'borracha'">
            Selecione a ferramenta e clique no mapa para desenhar.
          </small>
          <small class="dica-ferramenta" *ngIf="modoEdicao === 'borracha'" style="color: #dc3545; font-weight: bold;">
            Borracha ativa: Clique sobre um ponto ou parada para excluí-lo.
          </small>

        
        </div>
      </div>
    </div>
  </div>

  <div class="map-wrapper">
    <div id="mapAdmin"></div>
  </div>
<div class="modal-backdrop" *ngIf="paradaEmEdicao">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Editar Ponto</h3>
        <button class="btn-fechar" (click)="fecharEditorParada()">✕</button>
      </div>

      <div class="modal-body">
        <label>Nome do Ponto:</label>
        <input type="text" [(ngModel)]="paradaEmEdicao.nome" class="form-control" placeholder="Ex: Praça Central">

        <hr>

        <label>Horários de Passagem:</label>
        
        <div class="add-horario-row">
          <input type="time" [(ngModel)]="novoHorarioTemp" class="form-control">
          <button (click)="adicionarHorario()" class="btn-add">Adicionar</button>
        </div>

        <div class="lista-horarios">
          <div *ngFor="let hora of paradaEmEdicao.horarios; let i = index" class="horario-tag">
            {{ hora }}
            <span (click)="removerHorario(i)" title="Remover">✕</span>
          </div>
          <div *ngIf="!paradaEmEdicao.horarios?.length" style="color: #999; font-size: 0.8rem;">
            Nenhum horário cadastrado.
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-salvar" (click)="salvarEdicaoParada()">Salvar Alterações</button>
      </div>
    </div>
  </div>

</div>
